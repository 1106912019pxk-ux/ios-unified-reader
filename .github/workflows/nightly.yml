name: Build and upload nightly ipa

on:
  push:
    branches:
      - build/aidoku-20260822-r2
    paths:
      - ".github/workflows/nightly.yml"

permissions:
  contents: write

concurrency:
  group: build-aidoku-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"
      - name: Install Xcode platforms
        run: |
          xcrun simctl list > /dev/null # fixes next command sometimes failing
          xcodebuild -downloadPlatform iOS
      - name: Get commit SHA
        id: commitinfo
        run: echo "::set-output name=sha_short::$(git rev-parse --short HEAD)"
      - name: Build
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -scheme "Aidoku (iOS)" -configuration Release archive -archivePath build/Aidoku.xcarchive -skipPackagePluginValidation CODE_SIGN_IDENTITY= CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/xcodebuild.log
      - name: Package ipa
        run: |
          mkdir Payload
          cp -r build/Aidoku.xcarchive/Products/Applications/Aidoku.app Payload
          zip -r Aidoku-iOS_nightly-${{ steps.commitinfo.outputs.sha_short }}.ipa Payload
      - name: Publish fixed Aidoku package path
        run: |
          mkdir -p release/aidoku
          cp Aidoku-iOS_nightly-*.ipa release/aidoku/Aidoku-iOS-latest.ipa
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/aidoku/Aidoku-iOS-latest.ipa
          if ! git diff --cached --quiet; then
            git commit -m "build(aidoku): publish latest IPA"
            git push
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Aidoku-iOS_nightly-${{ steps.commitinfo.outputs.sha_short }}.ipa
          path: Aidoku-iOS_nightly-${{ steps.commitinfo.outputs.sha_short }}.ipa
          if-no-files-found: error
      - name: Publish failure diagnostics
        if: failure()
        run: |
          mkdir -p release/aidoku
          {
            echo "Aidoku build failed at commit $GITHUB_SHA"
            if [ -f build/xcodebuild.log ]; then
              tail -n 500 build/xcodebuild.log
            else
              echo "xcodebuild.log was not created; failure happened before compilation."
            fi
          } > release/aidoku/build-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/aidoku/build-failure.log
          git commit -m "build(aidoku): publish failure diagnostics"
          git push

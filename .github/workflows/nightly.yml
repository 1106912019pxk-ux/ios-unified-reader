name: Build and upload nightly ipa

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"
      - name: Install Xcode platforms
        run: |
          xcrun simctl list > /dev/null # fixes next command sometimes failing
          xcodebuild -downloadPlatform iOS
      - name: Get commit SHA
        id: commitinfo
        run: echo "::set-output name=sha_short::$(git rev-parse --short HEAD)"
      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -scheme "Aidoku (iOS)" -clonedSourcePackagesDirPath build/SourcePackages
      - name: Patch Readium Zip for Xcode 26
        run: |
          python3 - <<'PY'
          import stat
          from pathlib import Path

          headers = Path("build/SourcePackages/checkouts/Zip/Zip/minizip/include")

          crypt = headers / "crypt.h"
          crypt.chmod(crypt.stat().st_mode | stat.S_IWUSR)
          text = crypt.read_text()
          old = "register int keyshift"
          if old not in text:
              raise RuntimeError("Expected Minizip register declaration was not found")
          crypt.write_text(text.replace(old, "int keyshift", 1))

          opening = '#ifdef __cplusplus\nextern "C" {\n#endif\n\n'
          anchor = "#define Z_BZIP2ED 12"
          for name in ("unzip.h", "zip.h"):
              header = headers / name
              header.chmod(header.stat().st_mode | stat.S_IWUSR)
              text = header.read_text()
              if opening not in text or anchor not in text:
                  raise RuntimeError(f"Expected Minizip linkage markers were not found in {name}")
              text = text.replace(opening, "", 1)
              text = text.replace(anchor, opening + anchor, 1)
              header.write_text(text)
          PY
      - name: Build
        run: xcodebuild -scheme "Aidoku (iOS)" -configuration Release archive -archivePath build/Aidoku.xcarchive -clonedSourcePackagesDirPath build/SourcePackages -disableAutomaticPackageResolution -skipPackagePluginValidation CODE_SIGN_IDENTITY= CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
      - name: Package ipa
        run: |
          mkdir Payload
          cp -r build/Aidoku.xcarchive/Products/Applications/Aidoku.app Payload
          zip -r Aidoku-iOS_nightly-${{ steps.commitinfo.outputs.sha_short }}.ipa Payload
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Aidoku-iOS_nightly-${{ steps.commitinfo.outputs.sha_short }}.ipa
          path: Aidoku-iOS_nightly-${{ steps.commitinfo.outputs.sha_short }}.ipa
          if-no-files-found: error

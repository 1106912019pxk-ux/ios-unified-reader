name: Readium SwiftPM Resolution Spike

on:
  push:
    branches:
      - spike/readium-spm-resolution
    paths:
      - "_spikes/readium-spm/**"
      - ".github/workflows/readium-spm-resolution.yml"

jobs:
  resolve:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Resolve Aidoku and Readium ZIP dependencies
        run: swift package resolve --package-path _spikes/readium-spm
